metadata:
  name: no-scale-down
cluster:
  pods:
    default/pod-a:
      owner: app
      resources:
        cpu: 1
        memory: 1
      labels:
        app: demo
      evictable: true
  nodes:
    node-a:
      allocatable:
        cpu: 4
        memory: 4
      pods:
        - default/pod-a
imbalanceConfig:
  resources:
    - cpu
    - memory
  threshold: 1.0
evictionPolicy:
  reservationFirst: true
  denyNamespaces:
    - kube-system
binpackConfig:
  victims: 0
events: {}
