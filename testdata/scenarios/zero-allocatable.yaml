metadata:
  name: zero-allocatable
cluster:
  pods:
    default/pod-a:
      owner: app
      resources:
        cpu: 1
        memory: 1
      labels:
        app: demo
      evictable: true
  nodes:
    node-a:
      allocatable:
        cpu: 0
        memory: 0
      pods:
        - default/pod-a
imbalanceConfig:
  resources:
    - cpu
    - memory
  threshold: 0.1
evictionPolicy:
  reservationFirst: true
  denyNamespaces:
    - kube-system
binpackConfig:
  victims: 0
events: {}
